<!doctype html>
<html lang="en">

<head>
    <!--
      Fonts are linked here rather than @import-ed from CSS. An @import inside a
      stylesheet cannot start until that stylesheet has downloaded and parsed,
      which serialises HTML -> CSS -> Google Fonts CSS -> font files. Linking
      them alongside a preconnect lets the browser open the connection and fetch
      the CSS in parallel with our own.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cluwudy — Artist Portfolio</title>
  <meta name="title" content="Cluwudy — Artist Portfolio" />
  <meta name="description" content="Original character art, commissions, and VTuber designs by Cluwudy." />
  <meta name="theme-color" content="#AFCBFF" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cluwudy — Artist Portfolio" />
  <meta property="og:description" content="Original character art, commissions, and VTuber designs by Cluwudy." />
  <meta property="og:image" content="/social-card.jpg" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Cluwudy — Artist Portfolio" />
  <meta property="twitter:description" content="Original character art, commissions, and VTuber designs by Cluwudy." />
  <meta property="twitter:image" content="/social-card.jpg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
